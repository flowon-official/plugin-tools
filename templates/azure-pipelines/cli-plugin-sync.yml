# Steps for flowon-xrm's CLI release: proposes the CLI skill (next to the CLI's code) to the flowon-dynamics plugin as a
# pull request with a patch version, so the plugin's copy can't fall behind the CLI. Merging it releases the plugin
# through the plugin's own workflow, and a release owner approves the catalog pull request that follows.
#
# Include after the CLI's package is published:
#   - template: <path>/cli-plugin-sync.yml
#     parameters:
#       cliVersion: $(CliVersion)
#
# Needs, in a variable group: FlowonReleaseAppId, and FlowonReleaseAppKey (secret: the org's release GitHub App's
# private key; the App is installed on flowon-official/flowon-dynamics-plugin).
parameters:
  - name: cliVersion
    type: string
  - name: toolsRef
    type: string
    default: v1

steps:
  - bash: git clone --quiet --depth 1 --branch "${{ parameters.toolsRef }}" https://github.com/flowon-official/plugin-tools.git "$(Agent.TempDirectory)/plugin-tools"
    displayName: Get plugin-tools

  - bash: |
      set -euo pipefail
      tools="$(Agent.TempDirectory)/plugin-tools"
      token=$(node "$tools/bin/app-token.mjs" --owner flowon-official --repo flowon-dynamics-plugin)
      echo "##vso[task.setvariable variable=CliPluginToken;issecret=true]$token"
      { read -r name; read -r email; } < <(node "$tools/bin/app-token.mjs" --identity)
      echo "##vso[task.setvariable variable=ReleaseBotName]$name"
      echo "##vso[task.setvariable variable=ReleaseBotEmail]$email"
    displayName: Get a token for the CLI plugin
    env:
      GITHUB_APP_ID: $(FlowonReleaseAppId)
      GITHUB_APP_PRIVATE_KEY: $(FlowonReleaseAppKey)

  - bash: |
      set -euo pipefail
      tools="$(Agent.TempDirectory)/plugin-tools"
      plugin="$(Agent.TempDirectory)/flowon-dynamics-plugin"
      git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/flowon-official/flowon-dynamics-plugin.git" "$plugin"
      cd "$plugin"
      node scripts/sync-cli-skill.mjs "$(Build.SourcesDirectory)"
      if git diff --quiet; then
        echo "The plugin's CLI skill already matches flowon-dynamics ${{ parameters.cliVersion }}."
        exit 0
      fi
      node "$tools/bin/bump-version.mjs" . patch --note "The CLI skill from flowon-dynamics ${{ parameters.cliVersion }}."
      branch="cli-skill/${{ parameters.cliVersion }}"
      git checkout -q -b "$branch"
      git -c user.name="$(ReleaseBotName)" -c user.email="$(ReleaseBotEmail)" commit -q -am "The CLI skill from flowon-dynamics ${{ parameters.cliVersion }}"
      git push -q --force origin "$branch"
      node "$tools/bin/open-pr.mjs" --repo flowon-official/flowon-dynamics-plugin --head "$branch" \
        --title "The CLI skill from flowon-dynamics ${{ parameters.cliVersion }}" \
        --body "Copied from flowon-xrm at $(Build.SourceVersion) by the CLI's release. Merging releases the plugin with a patch version."
    displayName: Propose the CLI skill to the plugin
    env:
      GH_TOKEN: $(CliPluginToken)
